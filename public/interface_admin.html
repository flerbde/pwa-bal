<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interface Admin</title>
    <link rel="stylesheet" href="styles.css">
    <script src="js/connection.js" defer></script>
    <link rel="manifest" href="manifest.json">
    <script src="js/qr.code.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <!-- 📱 Icônes pour iOS -->
    <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">

    <!-- 🎨 Couleur de la barre du haut (Safari) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Bal de Promo">
</head>
<body>
    <div id="offline-message" class="offline hidden">⚠️ Pas de connexion, impossible de se connecter</div>

    <!-- LOGO -->
    <div class="logo-container">
        <img src="assets/logo.png" alt="Logo" class="logo">
    </div>

    <!-- CONTAINER PRINCIPAL -->
    <div class="container" >
        <h1>🔑 Interface Admin </h1>
        
        <!-- FORMULAIRE DE CONNEXION -->
        <div id="admin-login" class="admin-box">
            <label for="password"> Mot de passe :</label>
            <input type="password" id="password" class="input">
            <button id="login-btn" class="btn">Connexion</button>
            <script>
                document.addEventListener("DOMContentLoaded", () => {
                    const inputField = document.querySelector("#password");
                    const loginButton = document.querySelector("#login-btn");
            
                    inputField.addEventListener("keypress", (event) => {
                        if (event.key === "Enter") {
                            event.preventDefault(); // Empêche le rechargement de la page
                            loginButton.click(); // Simule un clic sur le bouton Connexion
                        }
                    });
                });
            </script>
            <button onclick="location.href='index.html'" class="btn">🏠 Retour Accueil</button>
        </div>

        <!-- PANNEAU ADMIN -->
        <div id="admin-panel" class="admin-box" style="display:none;">
            
            <!-- 📊 STATISTIQUES -->
            <h2>📊 Statistiques :</h2>
            <div class="stats-container">
                <div class="stat-card">
                    <h3> Entrées validées</h3>
                    <p id="entries-count">0</p>
                </div>
                <div class="stat-card">
                    <h3> Consommations totales</h3>
                    <p id="total-conso">0</p>
                </div>
            </div>
            
            <h2>🎟️ Génération d'un billet : </h2>
            
            <label for="nom">Nom :</label>
            <input type="text" id="nom" class="input">
        
            <label for="prenom">Prénom :</label>
            <input type="text" id="prenom" class="input">
        
            <label for="email">Email :</label>
            <input type="email" id="email" class="input">
        
            <label for="type">Type d'entrée :</label>
            <select id="type" class="input">
                <option value="Élève">Élève</option>
                <option value="Ancien élève">Ancien élève</option>
                <option value="Professeur">Professeur</option>
            </select>
        
            <button id="generate-btn" class="btn">🚀 Générer le billet</button>

            <!-- QR Code affiché ici -->
            <div id="qrcode" class="qrcode-container"></div>
        
            <!-- Bouton de téléchargement et envoi par mail (cachés au départ) -->
            <div id="download-container" style="display:none;"></div>
            <div id="email-container" style="display:none;"></div>
        
            <!-- 👤 GESTION DES PARTICIPANTS -->
            <h2>👤 Gestion des participants :</h2>
        
            <div id="search-participant">
            <label for="search-id">ID ou nom du participant :</label>
            <input type="text" id="search-id" class="input" placeholder="Entrez ID ou nom">
            <button id="search-btn" class="btn">🔍 Rechercher</button>
            <div id="search-results-container">
            <!-- Les résultats de recherche seront ajoutés ici dynamiquement -->
            </div>
            </div>
            <button id="scan-qr" class="btn">📷 Scanner un QR Code</button>
            <div id="participant-info" class="info-box" style="display:none;">
                <h3>Informations du Participant</h3>
                <p><strong>Nom :</strong> <span id="p-nom"></span></p>
                <p><strong> Prénom :</strong> <span id="p-prenom"></span></p>
                <p><strong> Type :</strong> <span id="p-type"></span></p>
                <p><strong> Solde :</strong> <span id="p-solde"></span></p>

                <div class="btn-group">
                    <button id="reset-solde" class="btn danger"> Réinitialiser le solde</button>
                    <button id="reset-ticket" class="btn danger"> Remettre le billet "non scanné"</button>
                    <button id="delete-ticket" class="btn danger">🗑️ Supprimer le billet</button>
                </div>
            </div>
            
            <button id="logout" class="btn logout">🚪 Déconnexion admin</button>
        </div>
    </div>

    <script src="js/admin.js" type="module"></script>
    <script src="js/html5-qrcode.min.js"></script>
    <script src="js/generation_qr.js" type="module"></script>
</body>
</html>

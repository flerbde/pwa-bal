<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Consommations</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="js/conso.js"></script>
    <script src="js/connection.js" defer></script>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
 <!-- 📱 Icônes pour iOS -->
 <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">

 <!-- 🎨 Couleur de la barre du haut (Safari) -->
 <meta name="apple-mobile-web-app-capable" content="yes">
 <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
 <meta name="apple-mobile-web-app-title" content="Bal de Promo">


</head>
<body>
    <div id="offline-message" class="offline hidden">⚠️ Pas de connexion, impossible de se connecter</div>
    <div class="logo-container">
        <img src="assets/logo.png" alt="Logo" class="logo">
    </div>
    <div class="container">
        <h1><strong>🍹 Gestion des Consommations</strong></h1>
        <div id="message"></div>

        <h2>👤 Participant : </h2>
        <p><strong>Nom et prénom :</strong> <span id="participant-name">Chargement...</span></p>
        <p><strong>Type d’entrée :</strong> <span id="participant-type">Chargement...</span></p>

        <h2> Solde des consommations : </h2>
        <p><strong>Solde :</strong> <span id="solde">0</span></p>

        <button id="add-conso" class="btn">➕ Ajouter une consommation</button>
        <button id="remove-conso" class="btn danger">➖ Retirer une consommation</button>
        <button onclick="location.href='scanner_acces.html'" class="btn">📷 Scanner un autre billet</button>
    </div>
</body>
</html>

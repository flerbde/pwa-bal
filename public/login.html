<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion</title>
    <link rel="stylesheet" href="styles.css">
    <script src="js/connection.js" defer></script>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
 <!-- 📱 Icônes pour iOS -->
 <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">

 <!-- 🎨 Couleur de la barre du haut (Safari) -->
 <meta name="apple-mobile-web-app-capable" content="yes">
 <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
 <meta name="apple-mobile-web-app-title" content="Bal de Promo">
</head>
<body>
    <div class="logo-container">
        <img src="assets/logo.png" alt="Logo" class="logo">
    </div>
    <div id="offline-message" class="offline hidden">⚠️ Pas de connexion, impossible de se connecter</div>

    <div class="container">
        <h1>🔒 Connexion</h1>
        <p>Veuillez entrer le mot de passe pour accéder à l'application.</p>
        
        <input type="password" id="password" class="input" placeholder="Mot de passe">
        <button id="login-btn" class="btn">Connexion</button>
        <script>
            document.addEventListener("DOMContentLoaded", () => {
                const inputField = document.querySelector("#password");
                const loginButton = document.querySelector("#login-btn");
        
                inputField.addEventListener("keypress", (event) => {
                    if (event.key === "Enter") {
                        event.preventDefault(); // Empêche le rechargement de la page
                        loginButton.click(); // Simule un clic sur le bouton Connexion
                    }
                });
            });
        </script>
        <p id="error-message" class="error" style="display:none;">❌ Mot de passe incorrect</p>
    </div>

    <script>
        const PASSWORD = "bal2024"; // Mot de passe défini

        document.getElementById("login-btn").addEventListener("click", () => {
            const enteredPassword = document.getElementById("password").value;

            if (enteredPassword === PASSWORD) {
                localStorage.setItem("authenticated", "true"); // Stockage en local
                window.location.href = "index.html"; // Redirection
            } else {
                document.getElementById("error-message").style.display = "block";
            }
        });

        // Vérifie si l'utilisateur est déjà authentifié
        if (localStorage.getItem("authenticated") === "true") {
            window.location.href = "index.html";
        }
    </script>
</body>
</html>

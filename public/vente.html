<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vente de Billets</title>
    <link rel="stylesheet" href="styles.css">
    <script src="js/connection.js" defer></script>
    <link rel="manifest" href="manifest.json">
    <script src="js/qr.code.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    

    <!-- 📱 Icônes pour iOS -->
    <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">

    <!-- 🎨 Couleur de la barre du haut (Safari) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Bal de Promo">
</head>
<body>
   
    <div id="offline-message" class="offline hidden">⚠️ Pas de connexion, impossible de se connecter</div>

    <!-- LOGO -->
    <div class="logo-container">
        <img src="assets/logo.png" alt="Logo" class="logo">
    </div>

    <!-- CONTAINER PRINCIPAL -->
    <div class="container">
        <h1>🎟️ Vente de Billets</h1>

        <!-- FORMULAIRE DE VENTE -->
        <form id="vente-form">
            <label for="nom">Nom :</label>
            <input type="text" id="nom" class="input" required>

            <label for="prenom">Prénom :</label>
            <input type="text" id="prenom" class="input" required>

            <label for="email">Email :</label>
            <input type="email" id="email" class="input" required>

            <label for="type">Type d'entrée :</label>
            <select id="type" class="input" required>
                <option value="Élève">Élève</option>
                <option value="Ancien élève">Ancien élève</option>
                <option value="Professeur">Professeur</option>
            </select>

            <label for="payment-type">Type de paiement :</label>
            <select id="payment-type" class="input" required>
                <option value="Carte bancaire">Carte bancaire</option>
                <option value="Espèces">Espèces</option>
                <option value="Autre">Autre</option>
            </select>

            <button type="submit" id="generate-btn" class="btn">🚀 Générer le billet</button>
        </form>

        <!-- QR Code affiché ici -->
        <div id="qrcode" class="qrcode-container"></div>

        <!-- Message de confirmation -->
        <div id="confirmation-message" class="hidden">
            <p>Email envoyé avec succès ! ✅</p>
        </div>

        <!-- Message d'erreur (si un champ est manquant ou une erreur) -->
        <div id="message" class="hidden">
            <p id="message-content"></p>
        </div>
        <button onclick="location.href='index.html'" class="btn">🏠 Retour Accueil</button>
    </div>

    <script src="js/vente.js" type="module"></script>
    <script src="js/html5-qrcode.min.js"></script>
    


</body>
</html>
